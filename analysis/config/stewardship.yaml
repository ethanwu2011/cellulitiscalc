# Antibiotic stewardship: systemic antibiotic name patterns (lowercased LIKE substrings).
# Days-of-therapy (DOT) = sum over antibiotic orders of (stop_day - start_day + 1).
# Antibiotics given to pseudocellulitis (mimic) patients are counted as potentially unnecessary exposure.

